version: '3.8'

services:
  # Cloud Storage Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-storage
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-52428800}
    volumes:
      # Persist uploaded files
      - uploads_data:/app/uploads
      # Optional: Mount service account key
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    networks:
      - cloud-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: cloud-storage-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - cloud-network
    profiles:
      - with-nginx

volumes:
  uploads_data:
    driver: local
    name: cloud-storage-uploads

networks:
  cloud-network:
    driver: bridge
    name: cloud-storage-network
